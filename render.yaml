services:
  - type: web
    name: nervus-backend
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm run build
    startCommand: node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
